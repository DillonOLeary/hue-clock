[project]
name = "hue-clock"
version = "0.1.0"
description = "Clock in/out by Hue focus lamp — event-sourced, append-only logging to Capacities daily notes, with a macOS menu bar app"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "eventsourcing==9.5.4",
    "rumps>=0.4",
]

[project.scripts]
hue-clock = "hue_clock.menubar:main"
hue-clock-listener = "hue_clock.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.15.22",
    "tach>=0.35.0",
]
build = [
    "pillow>=10",
    "py2app>=0.28.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstrings are not required — the code is meant to speak for itself
    # (CodeAesthetic). Docstring *quality* rules (D2xx/D4xx) stay enabled.
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D203", "D213",  # resolve the two D-rule conflicts (keep D211, D212)
    # unittest, not pytest — the flake8-pytest-style rules do not apply.
    "PT",
    # Personal project; per-file copyright headers are noise.
    "CPY",
    # Clock in/out is wall-clock local time; naive datetimes are the model.
    "DTZ",
    # Emoji, ·, −, – in note lines are load-bearing (parity with Capacities).
    "RUF001", "RUF002", "RUF003",
    # Deliberate output: CLI results and the observability log file.
    "T20",
    # on/approx/no_timestamp booleans are natural domain parameters here.
    "FBT",
    # except-Exception at the listener/flusher/UI edges is intentional: a
    # projection or publish failure must never crash the tracker.
    "BLE001",
    # Event-apply methods, rumps callbacks, and lambdas take framework-
    # required parameters they don't all read.
    "ARG",
    # Exception-message ergonomics — not worth the indirection at this size.
    "EM", "TRY003",
    # Domain exceptions read as domain language (AlreadyClockedIn), not FooError.
    "N818",
    # Handled by the formatter.
    "COM812",
    # Parameter annotations are not enforced — there is no type checker in the
    # project, so mandating them on framework callbacks and duck-typed clients
    # is cost without payoff. Return types (ANN2xx) stay enabled.
    "ANN001", "ANN002",
    # urllib opens hardcoded https endpoints (the Hue bridge, the Capacities API).
    "S310",
    # Display thresholds (60s, 2 resends) are self-evident where they appear.
    "PLR2004",
    # `line = line.strip()` and friends — reusing the loop name is idiomatic.
    "PLW2901",
    # open() is appropriate for the raw file descriptors held here.
    "PTH123",
    # Scripts are run via `uv run`, not executed directly.
    "EXE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "ANN",      # test signatures don't earn their annotations
    "D",        # test names are the documentation
    "S101",     # asserts are the point
    "SLF001",   # tests reach into internals on purpose
    "PLR2004",  # literal expected-values are clearer inline
]
"scripts/**" = ["S603", "S607", "ANN"]  # build tooling: trusted commands, throwaway helpers
"src/hue_clock/menubar.py" = ["SLF001"]  # rumps internals (_menu) and the app's own _refresh

[tool.ruff.format]
docstring-code-format = true
